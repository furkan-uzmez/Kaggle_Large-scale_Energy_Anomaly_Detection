[project]
name = "lead-anomaly"
version = "0.1.0"
authors = [
    { name = "furkan-uzmez", email = "furkan.n41@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["project*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
src = ["src", "tests"]
exclude = [
    ".agent",
    ".venv",
]


