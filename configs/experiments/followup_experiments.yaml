# Follow-up Experiments Configuration (Notebook 04 Section 8)
# Covers three post-ensemble research explorations:
# 1. EXP-F01: Diurnal-Weighted Manifold Mixup
# 2. EXP-F02: Platt-Calibrated Champion (Nested Zero-Leakage)
# 3. EXP-F03: Skip-Connection Leaf Stacking
#
# Lineage & Protocol:
# Evaluated across the 4x3 repeated Stratified Group K-Fold split manifest (grouped on building_id).

schema_version: 1
seed: 42
folds: 4
repeats: 3
split_seeds: [42, 43, 44]
split_manifest: outputs/splits/building_folds_repeated.parquet
data_path: outputs/prepared/train_joined.parquet
test_path: outputs/prepared/test_joined.parquet
sample_submission_path: data/energy-anomaly-detection/sample_submission.csv

target: anomaly
positive_label: 1

primary_metric: roc_auc
guardrails:
  - average_precision
  - log_loss
  - brier_score
  - ece

features:
  metadata:
    - building_id
    - timestamp
  target:
    - anomaly
  categorical:
    - primary_use
  predictors:
    - meter_reading
    - square_feet
    - year_built
    - floor_count
    - primary_use
    - hour
    - weekday
    - month
    - year
    - hour_x
    - hour_y
    - month_x
    - month_y
    - weekday_x
    - weekday_y
    - is_holiday
    - air_temperature
    - cloud_coverage
    - dew_temperature
    - precip_depth_1_hr
    - sea_level_pressure
    - wind_direction
    - wind_speed
    - air_temperature_mean_lag7
    - air_temperature_max_lag7
    - air_temperature_min_lag7
    - air_temperature_std_lag7
    - air_temperature_mean_lag73
    - air_temperature_max_lag73
    - air_temperature_min_lag73
    - air_temperature_std_lag73

experiments:
  exp_f01:
    experiment_id: EXP-F01
    title: "Diurnal-Weighted Manifold Mixup"
    candidate_id: lightgbm_diurnal_mixup
    recipe_id: recipe_diurnal_weighted_mixup
    model_family: lightgbm
    model_config_id: cfg_diurnal_mixup_default
    score_kind: positive_probability
    submission_filename: submission_39_diurnal_weighted_mixup.csv
    sampling:
      target_ratio: 0.08
      alpha_base: 0.4
      alpha_trans: 0.8
      trans_hours: [0, 1, 2, 3, 4, 17, 18, 19, 20, 21]
      trans_weight: 2.0
    base_params:
      learning_rate: 0.03
      n_estimators: 1000
      num_leaves: 31
      max_depth: -1
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.8
      reg_alpha: 0.1
      reg_lambda: 1.0
      min_child_samples: 20
      n_jobs: 12

  exp_f02:
    experiment_id: EXP-F02
    title: "Platt-Calibrated Champion"
    candidate_id: lightgbm_platt_calibrated
    recipe_id: recipe_platt_calibrated_mixup
    model_family: lightgbm
    model_config_id: cfg_platt_calibrated_default
    score_kind: positive_probability
    submission_filename: submission_40_platt_calibrated_mixup.csv
    calibration:
      method: platt_logistic
      inner_folds: 3
      c_regularization: 1.0
    base_params:
      learning_rate: 0.03
      n_estimators: 1000
      num_leaves: 31
      max_depth: -1
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.8
      reg_alpha: 0.1
      reg_lambda: 1.0
      min_child_samples: 20
      n_jobs: 12

  exp_f03:
    experiment_id: EXP-F03
    title: "Skip-Connection Leaf Stacking"
    candidate_id: skip_connection_leaf_stacking
    recipe_id: recipe_skip_connection_leaf_stacking
    model_family: linear_gbdt_stack
    model_config_id: cfg_skip_leaf_default
    score_kind: positive_probability
    submission_filename: submission_41_skip_connection_leaf_stacking.csv
    gbdt_params:
      learning_rate: 0.05
      n_estimators: 50
      num_leaves: 31
      max_depth: 5
      subsample: 0.8
      colsample_bytree: 0.8
      n_jobs: 12
    linear_params:
      loss: log_loss
      penalty: l2
      alpha: 0.0001
      max_iter: 1000
      tol: 0.001
