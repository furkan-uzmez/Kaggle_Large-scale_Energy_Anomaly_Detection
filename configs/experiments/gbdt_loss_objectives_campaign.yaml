# GBDT Loss Objectives Campaign Configuration
# Compares 3 Loss Objective Arms across LightGBM, CatBoost, and XGBoost:
# - Arm 1: logloss (Standard unweighted binary logloss)
# - Arm 2: weighted (Class-weighted binary loss, penalizing missed anomalies 8x)
# - Arm 3: focal (Focal loss with gamma=2.0, alpha=0.25 down-weighting easy background samples)
# Evaluated strictly on the frozen 4x3 repeated Stratified Group K-Fold split manifest.

schema_version: 1
seed: 42
folds: 4
repeats: 3
split_seeds: [42, 43, 44]
split_manifest: outputs/splits/building_folds_repeated.parquet
data_path: outputs/prepared/train_joined.parquet

target: anomaly
positive_label: 1

loss_arms:
  - logloss
  - weighted
  - focal

loss_definitions:
  logloss:
    name: logloss
    description: "Standard unweighted binary cross-entropy loss"
    score_kind: positive_probability
  weighted:
    name: weighted
    description: "Class-weighted binary loss penalizing false negatives (missed anomalies) 8x"
    pos_weight: 8.0
    score_kind: positive_probability
  focal:
    name: focal
    description: "Focal loss down-weighting easy background samples to focus gradients on hard border anomalies"
    alpha: 0.25
    gamma: 2.0
    score_kind: positive_probability

primary_metric: roc_auc
guardrails:
  - average_precision
  - log_loss
  - brier_score

features:
  metadata:
    - building_id
    - timestamp
  target:
    - anomaly
  excluded_forbidden:
    # Explicitly rejected columns: unverified gte family, IDs, and target/metadata
    - site_id
    - building_id
    - timestamp
    - anomaly
    - gte_hour
    - gte_weekday
    - gte_month
    - gte_building_id
    - gte_primary_use
    - gte_site_id
    - gte_meter
    - gte_meter_hour
    - gte_meter_weekday
    - gte_meter_month
    - gte_meter_building_id
    - gte_meter_primary_use
    - gte_site_id
    - gte_meter_site_id
    - gte_meter_building_id_hour
    - gte_meter_building_id_weekday
    - gte_meter_building_id_month
  numeric:
    # Core numeric
    - meter_reading
    - square_feet
    - year_built
    - floor_count
    # Calendar & cyclic
    - hour
    - weekday
    - month
    - year
    - hour_x
    - hour_y
    - month_x
    - month_y
    - weekday_x
    - weekday_y
    - is_holiday
    # Weather sensors
    - air_temperature
    - cloud_coverage
    - dew_temperature
    - precip_depth_1_hr
    - sea_level_pressure
    - wind_direction
    - wind_speed
    # Weather lags
    - air_temperature_mean_lag7
    - air_temperature_max_lag7
    - air_temperature_min_lag7
    - air_temperature_std_lag7
    - air_temperature_mean_lag73
    - air_temperature_max_lag73
    - air_temperature_min_lag73
    - air_temperature_std_lag73
    # Safe interactions (building_hour and building_meter removed)
  categorical:
    # Core categorical
    - primary_use
  predictors:
    # Safe verified 31 features allowlist
    - meter_reading
    - square_feet
    - year_built
    - floor_count
    - primary_use
    - hour
    - weekday
    - month
    - year
    - hour_x
    - hour_y
    - month_x
    - month_y
    - weekday_x
    - weekday_y
    - is_holiday
    - air_temperature
    - cloud_coverage
    - dew_temperature
    - precip_depth_1_hr
    - sea_level_pressure
    - wind_direction
    - wind_speed
    - air_temperature_mean_lag7
    - air_temperature_max_lag7
    - air_temperature_min_lag7
    - air_temperature_std_lag7
    - air_temperature_mean_lag73
    - air_temperature_max_lag73
    - air_temperature_min_lag73
    - air_temperature_std_lag73

models:
  lightgbm:
    model_family: lightgbm
    recipe_id: recipe_gbdt_loss_lightgbm
    model_config_id: cfg_gbdt_loss_lightgbm_default
    base_params:
      learning_rate: 0.03
      n_estimators: 1000
      num_leaves: 31
      max_depth: -1
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.8
      reg_alpha: 0.1
      reg_lambda: 1.0
      min_child_samples: 20
      seed: 42
      verbosity: -1
      n_jobs: 12
    arms:
      logloss:
        objective: binary
        metric: binary_logloss
      weighted:
        objective: binary
        metric: binary_logloss
        scale_pos_weight: 8.0
      focal:
        objective: focal_loss_lgb
        alpha: 0.25
        gamma: 2.0

  catboost:
    model_family: catboost
    recipe_id: recipe_gbdt_loss_catboost
    model_config_id: cfg_gbdt_loss_catboost_default
    base_params:
      learning_rate: 0.03
      iterations: 1000
      depth: 6
      l2_leaf_reg: 3.0
      subsample: 0.8
      random_seed: 42
      verbose: false
      task_type: GPU
      thread_count: 12
    arms:
      logloss:
        loss_function: Logloss
        eval_metric: Logloss
      weighted:
        loss_function: Logloss
        eval_metric: Logloss
        class_weights: [1.0, 8.0]
      focal:
        loss_function: "Focal:focal_alpha=0.25;focal_gamma=2.0"
        eval_metric: Logloss
        alpha: 0.25
        gamma: 2.0

  xgboost:
    model_family: xgboost
    recipe_id: recipe_gbdt_loss_xgboost
    model_config_id: cfg_gbdt_loss_xgboost_default
    base_params:
      learning_rate: 0.03
      n_estimators: 1000
      max_depth: 6
      subsample: 0.8
      colsample_bytree: 0.8
      reg_alpha: 0.1
      reg_lambda: 1.0
      min_child_weight: 1.0
      seed: 42
      tree_method: hist
      n_jobs: 12
    arms:
      logloss:
        objective: "binary:logistic"
        eval_metric: logloss
      weighted:
        objective: "binary:logistic"
        eval_metric: logloss
        scale_pos_weight: 8.0
      focal:
        objective: focal_loss_xgb
        alpha: 0.25
        gamma: 2.0
