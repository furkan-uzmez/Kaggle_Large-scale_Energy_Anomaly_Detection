# Tabular MLP Campaign Configuration
# Two-arm A/B (control vs. challenger) evaluation over the frozen 4x3
# building-grouped repeated CV, adding architectural diversity to the
# ensemble pool next to GBDT candidates.

schema_version: 1
seed: 42
folds: 4
repeats: 3
split_seeds: [42, 43, 44]
split_manifest: outputs/splits/building_folds_repeated.parquet
data_path: outputs/prepared/train_joined.parquet

target: anomaly
positive_label: 1

primary_metric: roc_auc
guardrails:
  - average_precision
  - log_loss
  - brier_score

arms:
  - control
  - challenger

experiment_id: exp_tabular_mlp

features:
  numeric:
    - meter_reading
    - square_feet
    - year_built
    - floor_count
    - hour
    - weekday
    - month
    - year
    - hour_x
    - hour_y
    - month_x
    - month_y
    - weekday_x
    - weekday_y
    - is_holiday
    - air_temperature
    - cloud_coverage
    - dew_temperature
    - precip_depth_1_hr
    - sea_level_pressure
    - wind_direction
    - wind_speed
    - air_temperature_mean_lag7
    - air_temperature_max_lag7
    - air_temperature_min_lag7
    - air_temperature_std_lag7
    - air_temperature_mean_lag73
    - air_temperature_max_lag73
    - air_temperature_min_lag73
    - air_temperature_std_lag73
  categorical:
    - primary_use

arm_definitions:
  control:
    description: "Median imputation + StandardScaler"
    candidate_id: mlp_control
    recipe_id: recipe_tabular_mlp_control
    model_config_id: cfg_tabular_mlp_control_default
    arm_id: control
  challenger:
    description: "Control + per-column missing indicators + QuantileTransformer(normal)"
    candidate_id: mlp_challenger
    recipe_id: recipe_tabular_mlp_challenger
    model_config_id: cfg_tabular_mlp_challenger_default
    arm_id: challenger

model:
  model_family: tabular_mlp
  architecture:
    hidden_dims: [256, 128, 64]
    dropout: 0.2
    embedding_dim: 8
  training:
    epochs: 30
    batch_size: 1024
    lr: 0.001
    patience: 5
    weight_decay: 0.0001
