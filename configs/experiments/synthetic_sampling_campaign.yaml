# 3-Arm Synthetic Sampling Campaign Configuration
# Compares fold-local minority oversampling for LightGBM and ExtraTrees:
# - Arm 1: natural (control, original ~2.08% positive anomaly rate)
# - Arm 2: smote   (SMOTENC-style synthetic positives up to target_ratio)
# - Arm 3: mixup   (Tabular Mixup synthetic positives up to target_ratio)
# Synthetic rows are generated strictly inside each outer-training fold; the
# validation fold is always 100% genuine data. Evaluated on the frozen 4x3
# repeated Stratified Group K-Fold split manifest (grouped on building_id).

schema_version: 1
seed: 42
folds: 4
repeats: 3
split_seeds: [42, 43, 44]
split_manifest: outputs/splits/building_folds_repeated.parquet
data_path: outputs/prepared/train_joined.parquet

target: anomaly
positive_label: 1

model_families:
  - lightgbm
  - extratrees

sampling_arms:
  - natural
  - smote
  - mixup

sampling:
  target_ratio: 0.08
  k_neighbors: 5
  mixup_alpha: 0.4

arm_definitions:
  natural:
    name: natural
    description: "Control: original training fold, no synthetic rows"
    score_kind: positive_probability
  smote:
    name: smote
    description: "Fold-local SMOTENC sampling of the positive class to target_ratio"
    target_ratio: 0.08
    k_neighbors: 5
    score_kind: positive_probability
  mixup:
    name: mixup
    description: "Fold-local Tabular Mixup (Beta(alpha, alpha) convex combination) of the positive class to target_ratio"
    target_ratio: 0.08
    alpha: 0.4
    score_kind: positive_probability

primary_metric: roc_auc
guardrails:
  - average_precision
  - log_loss
  - brier_score

features:
  metadata:
    - building_id
    - timestamp
  target:
    - anomaly
  excluded_forbidden:
    - site_id
    - building_id
    - timestamp
    - anomaly
    - gte_hour
    - gte_weekday
    - gte_month
    - gte_building_id
    - gte_primary_use
    - gte_site_id
    - gte_meter
    - gte_meter_hour
    - gte_meter_weekday
    - gte_meter_month
    - gte_meter_building_id
    - gte_meter_primary_use
    - gte_meter_site_id
    - gte_meter_building_id_hour
    - gte_meter_building_id_weekday
    - gte_meter_building_id_month
  categorical:
    - primary_use
  predictors:
    # Safe verified 31 features allowlist (building_hour / building_meter removed:
    # large_string building-identity proxies; unseen in grouped CV, not numeric)
    - meter_reading
    - square_feet
    - year_built
    - floor_count
    - primary_use
    - hour
    - weekday
    - month
    - year
    - hour_x
    - hour_y
    - month_x
    - month_y
    - weekday_x
    - weekday_y
    - is_holiday
    - air_temperature
    - cloud_coverage
    - dew_temperature
    - precip_depth_1_hr
    - sea_level_pressure
    - wind_direction
    - wind_speed
    - air_temperature_mean_lag7
    - air_temperature_max_lag7
    - air_temperature_min_lag7
    - air_temperature_std_lag7
    - air_temperature_mean_lag73
    - air_temperature_max_lag73
    - air_temperature_min_lag73
    - air_temperature_std_lag73

models:
  lightgbm:
    model_family: lightgbm
    recipe_id: recipe_synthetic_sampling_lightgbm
    model_config_id: cfg_synthetic_sampling_lightgbm_default
    base_params:
      learning_rate: 0.03
      n_estimators: 1000
      num_leaves: 31
      max_depth: -1
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.8
      reg_alpha: 0.1
      reg_lambda: 1.0
      min_child_samples: 20
      n_jobs: 12

  extratrees:
    model_family: extratrees
    recipe_id: recipe_synthetic_sampling_extratrees
    model_config_id: cfg_synthetic_sampling_extratrees_default
    base_params:
      n_estimators: 300
      max_depth: null
      min_samples_split: 2
      min_samples_leaf: 5
      max_features: sqrt
      bootstrap: false
      n_jobs: 12
